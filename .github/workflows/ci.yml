name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        # Only the libraries the test suite actually imports. The heavy
        # infra deps (mlflow, evidently, sagemaker, airflow) are import-guarded
        # in the code, so they are not needed to run the tests.
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn pyarrow torch lightgbm pytest

      - name: Run tests
        run: pytest -q
